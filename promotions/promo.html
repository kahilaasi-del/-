<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבצעי נובמבר 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family:'Heebo',sans-serif; background:#f0f4f8; }

/* ===== כרטיסייה ===== */
/* פריסה אנכית (פלайר): תמונה גדולה למעלה · חותמת · גוף */
.card {
    background:white;
    border:1px solid #cfe8f6;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 3px 14px rgba(15,23,42,0.08);
    transition:transform .18s,box-shadow .18s;
    position:relative;
}
.card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(15,23,42,0.14); }

/* תמונה גדולה למעלה */
.card-img {
    position:relative; width:100%; height:185px;
    background:linear-gradient(160deg,#eaf6fc,#fff);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
}
.card-img img {
    width:100%; height:100%;
    object-fit:contain;
    padding:10px;
    box-sizing:border-box;
}
.no-img { font-size:64px; opacity:.3; }
.cat-rail { position:absolute; top:0; left:0; right:0; height:5px; }

/* חותמת מבצע עגולה (צד שמאל-עליון) */
.deal-stamp {
    position:absolute; top:12px; inset-inline-start:12px; z-index:3;
    width:68px; height:68px; border-radius:50%; color:#fff; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 34% 28%,#ff6a6a,#dc2626);
    box-shadow:0 5px 14px rgba(220,38,38,.45); border:3px solid #fff;
}
.deal-stamp::before { content:""; position:absolute; inset:-5px; border-radius:50%; border:2px dashed #fecaca; opacity:.7; }
.deal-stamp .b { font-size:20px; font-weight:900; line-height:.9; }
.deal-stamp .l { font-size:8.5px; font-weight:800; margin-top:2px; }

/* priority (ימין-עליון) */
.badge-pri { position:absolute; bottom:10px; inset-inline-end:12px; font-size:23px; z-index:3; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); line-height:1; }
.badge-new { position:absolute; bottom:10px; inset-inline-end:12px; z-index:3; background:#52a8dc; color:white; font-size:10px; font-weight:900; padding:2px 8px; border-radius:99px; }
.color-dot { position:absolute; bottom:10px; inset-inline-start:10px; width:20px; height:20px; border-radius:50%; border:2px solid #fff; cursor:pointer; z-index:3; box-shadow:0 2px 5px rgba(0,0,0,.2); }

/* תג כשרות (ירוק, פינה ימין-עליון) — סימטרי מול חותמת המבצע */
.kbadge { position:absolute; top:12px; inset-inline-end:12px; z-index:3;
    background:rgba(255,255,255,.95); color:#15803d; border:1px solid #bfe3c8; border-radius:9px;
    padding:2px 8px; font-size:10px; font-weight:800; max-width:58%; text-align:center; line-height:1.15;
    box-shadow:0 1px 4px rgba(0,0,0,.08); }

/* בחירת פריטים להדפסה — צ'קבוקס עגול למעלה-מרכז */
.pcheck { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:4;
    width:28px; height:28px; border-radius:50%; border:2px solid #b9d9ee; background:rgba(255,255,255,.95);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; color:#52a8dc;
    box-shadow:0 1px 6px rgba(0,0,0,.15); transition:background .12s,border-color .12s; }
.pcheck:hover { border-color:#52a8dc; background:#fff; }
.card.psel { outline:3px solid #52a8dc; outline-offset:-2px; }
.card.psel .pcheck { background:#52a8dc; color:#fff; border-color:#52a8dc; }
/* פס "נבחרו להדפסה" צף */
#selBar { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:600;
    background:#1c2e54; color:#fff; border-radius:99px; padding:9px 12px 9px 18px; display:none; align-items:center; gap:12px;
    box-shadow:0 6px 22px rgba(28,46,84,.42); font-size:14px; font-weight:800; font-family:Heebo,sans-serif; }
#selBar.show { display:flex; }
#selBar button { border:none; border-radius:99px; padding:8px 15px; font-weight:800; cursor:pointer; font-family:Heebo,sans-serif; font-size:13px; }
#selBar .sb-print { background:#52a8dc; color:#fff; }
#selBar .sb-clear { background:rgba(255,255,255,.18); color:#fff; }

/* גוף */
.card-body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; }
.card-name { font-size:14.5px; font-weight:800; color:#1c2e54; line-height:1.3; min-height:2.5em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* קנה X קבל Y% */
.buyget { align-self:flex-start; background:#52a8dc; color:#fff; border-radius:9px; padding:4px 11px;
    font-size:12.5px; font-weight:800; box-shadow:0 2px 6px rgba(82,168,220,.4); }

/* מטא */
.hc-meta { display:flex; flex-wrap:wrap; align-items:center; gap:3px 9px; font-size:11px; color:#5d7686; }
.hc-meta .sku { font-weight:700; color:#1c2e54; }
.hc-meta .sku b { color:#1c2e54; font-variant-numeric:tabular-nums; }
.hc-meta .k { color:#1c7fb0; font-weight:700; }
.hc-meta .v { color:#1c2e54; font-weight:600; font-variant-numeric:tabular-nums; }
.hc-meta .pack { background:#eaf6fc; color:#1c2e54; border:1px solid #cfe8f6; border-radius:7px; padding:1px 7px; font-weight:700; }
.hc-meta .sep { width:3px; height:3px; border-radius:50%; background:#cbd5e1; flex-shrink:0; }

.card-sep { height:1px; background:#eef3f7; }

/* מחיר + כמות בשורה */
.hc-price { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.pstrike { color:#b9c6d1; text-decoration:line-through; font-size:12px; font-variant-numeric:tabular-nums; }
.priceinfo { display:flex; flex-direction:column; align-items:flex-start; gap:1px; }
.pnet { display:flex; align-items:baseline; gap:4px; }
.pnet-label { font-size:10px; font-weight:800; color:#16a34a; }
.pnet-val { font-size:23px; font-weight:900; color:#1c2e54; line-height:1; font-variant-numeric:tabular-nums; }
.pnet-val small { font-size:12px; color:#5d7686; }

/* בקרת כמות */
.qty-ctrl { display:inline-flex; align-items:center; border:1.5px solid #cfe8f6; border-radius:10px; overflow:hidden; }
.qbtn { width:30px; height:30px; border:0; font-size:17px; font-weight:800; cursor:pointer; font-family:Heebo,sans-serif; line-height:1; }
.qbtn-minus { background:#eaf6fc; color:#1c2e54; }
.qbtn-minus:hover { background:#d7ecf8; }
.qbtn-plus { background:var(--plus,#52a8dc); color:var(--plusfg,#fff); }
.qbtn-plus:hover { filter:brightness(.96); }
.qinp { width:36px; height:30px; border:0; border-inline:1px solid #cfe8f6; text-align:center; font-size:14px; font-weight:800; font-family:Heebo,sans-serif; outline:none; -moz-appearance:textfield; }
.qinp::-webkit-outer-spin-button, .qinp::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.in-cart-mark { font-size:10.5px; color:#16a34a; font-weight:700; }

/* ── עריכת הסל ── */
.cart-row { display:flex; align-items:center; gap:8px; background:#f8fafc; border:1px solid #eef2f7; border-radius:10px; padding:7px 9px; margin-bottom:6px; }
.cart-nm { flex:1; min-width:0; font-size:12.5px; font-weight:700; color:#1e293b; line-height:1.25; }
.cart-ctr { display:inline-flex; align-items:center; border:1.5px solid #e2e8f0; border-radius:9px; overflow:hidden; background:white; flex-shrink:0; }
.cart-ctr .cbtn { width:26px; height:26px; border:0; background:#f1f5f9; color:#334155; font-size:15px; font-weight:700; cursor:pointer; font-family:Heebo,sans-serif; line-height:1; }
.cart-ctr .cbtn-p { background:#38bdf8; color:white; }
.cart-ctr .cqi { width:34px; height:26px; border:0; border-inline:1px solid #e2e8f0; text-align:center; font-size:13px; font-weight:700; font-family:Heebo,sans-serif; outline:none; -moz-appearance:textfield; }
.cart-ctr .cqi::-webkit-outer-spin-button, .cart-ctr .cqi::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.cdel { width:28px; height:28px; border:0; background:#fef2f2; color:#dc2626; border-radius:8px; cursor:pointer; font-size:14px; flex-shrink:0; }
.cdel:hover { background:#fee2e2; }
.cart-total { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:800; color:#334155; padding:9px 4px 2px; border-top:1px dashed #e2e8f0; margin-top:4px; }

/* קטגוריה */
.cat-section { margin-bottom:28px; }
.cat-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid #f1f5f9; }
.cat-stripe { width:5px; height:32px; border-radius:3px; flex-shrink:0; }
.cat-header h2 { font-size:18px; font-weight:900; color:#1e293b; }
.cat-count { background:#f1f5f9; color:#64748b; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; }

/* Header */
.site-header { background:white; border-radius:20px; box-shadow:0 2px 16px rgba(0,0,0,.08); padding:14px 22px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:4px solid #52a8dc; }
.logo-img { height:54px; width:auto; object-fit:contain; }
/* כותרות הניתנות לעריכה */
.h-edit { cursor:text; border-radius:6px; padding:1px 5px; outline:none; transition:background .15s,box-shadow .15s; }
.h-edit:hover { background:#f1f5f9; box-shadow:inset 0 0 0 1px #e2e8f0; }
.h-edit:focus { background:#fff; box-shadow:inset 0 0 0 2px #38bdf8; }

/* סל */
#cartBtn { position:fixed; bottom:24px; left:24px; z-index:500; background:#16a34a; color:white; border:none; border-radius:99px; padding:13px 20px; font-size:14px; font-weight:800; cursor:pointer; box-shadow:0 4px 18px rgba(22,163,74,0.4); display:none; align-items:center; gap:8px; font-family:Heebo,sans-serif; }
#cartBtn .cc { background:white; color:#16a34a; border-radius:99px; font-size:12px; font-weight:900; padding:1px 8px; }
#cartModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:flex-start; justify-content:flex-end; padding:16px; }
#cartModal.open { display:flex; }
.cart-box { background:white; border-radius:20px; width:420px; max-width:95vw; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden; }
.cart-hdr { padding:14px 18px 10px; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center; }
.cart-hdr h2 { font-size:16px; font-weight:800; color:#1e293b; }
.cart-inputs { padding:10px 18px; background:#f8fafc; border-bottom:1px solid #e2e8f0; display:flex; flex-direction:column; gap:7px; }
.cart-inp { border:2px solid #e2e8f0; border-radius:10px; padding:8px 12px; font-size:13px; font-family:Heebo,sans-serif; outline:none; direction:rtl; width:100%; box-sizing:border-box; }
.cart-inp:focus { border-color:#dc2626; }
#cartList { overflow-y:auto; flex:1; padding:10px 16px; min-height:60px; }
.cart-ftr { padding:12px 18px; border-top:1px solid #f1f5f9; display:flex; flex-direction:column; gap:7px; }
.btn-wa { background:#25d366; color:white; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:800; cursor:pointer; font-family:Heebo,sans-serif; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-close { background:transparent; color:#94a3b8; border:2px solid #e2e8f0; border-radius:12px; padding:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:Heebo,sans-serif; }

/* color picker */
#cpopup { position:fixed; z-index:2000; background:white; border-radius:13px; padding:11px; box-shadow:0 8px 28px rgba(0,0,0,.22); display:none; width:318px; }
.cpopup-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:5px; }
.csw { width:23px; height:23px; border-radius:4px; cursor:pointer; border:2px solid transparent; transition:transform .15s; }
.csw:hover { transform:scale(1.25); border-color:rgba(0,0,0,.25); }
.color-dot { position:absolute; bottom:7px; left:7px; width:20px; height:20px; border-radius:50%; border:2px solid white; cursor:pointer; z-index:3; box-shadow:0 2px 5px rgba(0,0,0,.2); }

/* sort modal */
#sortModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
#sortModal.open { display:flex; }
.sbox { background:white; border-radius:20px; padding:22px; max-width:540px; width:93%; max-height:83vh; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden; }
.srow { display:flex; align-items:center; gap:9px; background:#f8fafc; border:2px solid #e2e8f0; border-radius:10px; padding:8px 11px; cursor:grab; user-select:none; }
.srow.dragging { opacity:.4; border-color:#dc2626; }
.srow.dt { border-top:3px solid #dc2626!important; }
.srow.db { border-bottom:3px solid #dc2626!important; }
.srow img { width:36px; height:36px; object-fit:contain; border-radius:5px; background:#f1f5f9; border:1px solid #e2e8f0; flex-shrink:0; }
.srow .si { flex:1; min-width:0; }
.srow .sn { font-size:11.5px; font-weight:700; color:#1e293b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.srow .sid { font-size:9.5px; color:#94a3b8; }
.srow .snum { font-size:11px; font-weight:700; color:#dc2626; min-width:20px; text-align:center; }
.srow .sh { color:#94a3b8; font-size:15px; flex-shrink:0; }
#ssearch { direction:rtl; width:100%; border:2px solid #e2e8f0; border-radius:99px; padding:7px 13px; font-size:13px; outline:none; font-family:inherit; }
#ssearch:focus { border-color:#dc2626; }

/* ── מובייל: אריחים מרובעים ── */
@media (max-width:600px){
  .grid{ grid-template-columns:repeat(2,1fr)!important; gap:10px!important; }
  .card-img{ height:140px; }
  .deal-stamp{ width:54px; height:54px; top:8px; inset-inline-start:8px; }
  .deal-stamp .b{ font-size:16px; } .deal-stamp .l{ font-size:7.5px; }
  .card-body{ padding:10px 11px 12px; gap:6px; }
  .card-name{ font-size:13px; min-height:2.4em; }
  .buyget{ font-size:11.5px; padding:3px 9px; }
  .hc-meta{ font-size:10px; gap:2px 7px; }
  .pnet-val{ font-size:19px; }
  .badge-pri{ font-size:19px; }
  .site-header{ flex-wrap:wrap; justify-content:center; text-align:center; gap:8px 14px; padding:12px 14px; }
  .site-header>div{ min-width:0!important; }
}
@media (max-width:360px){ .grid{ grid-template-columns:1fr!important; } }

/* ===== הדפסה — עמודים מעומדים A4: כותרת מלאה + 12 כרטיסים ממורכזים + פס הזמנות בכל עמוד ===== */
#printRoot{ display:none; }
@page { size:A4 portrait; margin:0; }
@media print {
  *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
  html,body{ background:#fff!important; margin:0!important; padding:0!important; }
  body>*:not(#printRoot){ display:none!important; }
  #printRoot{ display:block!important; }

  .pp-page{ width:210mm; min-height:297mm; box-sizing:border-box; padding:7mm; background:#f4f8fb;
    display:flex; flex-direction:column; break-after:page; page-break-after:always; overflow:hidden; }
  .pp-page:last-child{ break-after:auto; page-break-after:auto; }

  /* כרטיס מותג לבן (כמו באתר) */
  .pp-brand{ display:flex; align-items:center; justify-content:center; gap:16px; background:#fff;
    border-radius:16px; padding:9px 18px; border-bottom:4px solid #52a8dc; flex-wrap:wrap; }
  .pp-brand .lg{ display:flex; align-items:center; gap:9px; }
  .pp-brand .lg img{ height:36px; } .pp-brand .lg span{ font-size:14px; font-weight:800; color:#1c2e54; }
  .pp-brand .tt{ font-size:22px; font-weight:900; color:#1c2e54; }
  .pp-brand .vv{ background:#eaf6fc; color:#1c2e54; border:1.5px solid #cfe8f6; border-radius:99px; padding:5px 13px; font-size:12px; font-weight:800; }

  /* פס קטגוריה כחול מלא */
  .pp-cat{ display:flex; align-items:center; gap:11px; background:linear-gradient(90deg,#52a8dc,#1c2e54);
    color:#fff; border-radius:11px; padding:9px 18px; margin-top:10px; }
  .pp-cat h2{ font-size:17px; font-weight:900; margin:0; }
  .pp-cat .cnt{ background:rgba(255,255,255,.22); border-radius:99px; padding:3px 11px; font-size:12px; font-weight:800; }

  /* גוף — 12 כרטיסים ממורכזים (עמוד חלקי: צמוד למעלה) */
  .pp-body{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; padding:6px 0; }
  .pp-page.partial .pp-body{ justify-content:flex-start; }
  .pp-grid{ display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:1fr; gap:9px; }

  /* פס הזמנות בתחתית כל עמוד */
  .pp-foot{ background:linear-gradient(90deg,#1c2e54,#52a8dc); color:#fff; border-radius:13px;
    padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .pp-foot img{ height:30px; background:#fff; border-radius:7px; padding:4px; }
  .pp-foot .c{ font-size:13px; font-weight:800; } .pp-foot .s{ font-size:11px; opacity:.92; font-weight:600; }

  /* כרטיס קומפקטי בתוך עמוד הדפסה */
  .pp-grid .card{ box-shadow:none!important; border:1px solid #cfe8f6!important; border-radius:12px!important; break-inside:avoid!important; }
  .pp-grid .card-img{ height:88px!important; }
  .pp-grid .card-img img{ padding:5px!important; }
  .pp-grid .deal-stamp{ width:44px!important; height:44px!important; top:7px!important; inset-inline-start:7px!important;
    background:#dc2626!important; background-image:none!important; box-shadow:none!important; border:2px solid #fff!important; }
  .pp-grid .deal-stamp::before{ display:none!important; }
  .pp-grid .deal-stamp .b{ font-size:13px!important; } .pp-grid .deal-stamp .l{ font-size:6px!important; }
  .pp-grid .kbadge{ top:8px!important; inset-inline-end:8px!important; font-size:8px!important; padding:1px 6px!important; box-shadow:none!important; }
  .pp-grid .card-body{ padding:8px 9px 9px!important; gap:5px!important; }
  .pp-grid .card-name{ font-size:10.5px!important; min-height:2.6em!important; }
  .pp-grid .buyget{ font-size:9.5px!important; padding:2px 7px!important; box-shadow:none!important; }
  .pp-grid .hc-meta{ font-size:8.5px!important; gap:2px 6px!important; }
  .pp-grid .pnet-label{ font-size:7.5px!important; } .pp-grid .pnet-val{ font-size:16px!important; } .pp-grid .pstrike{ font-size:9px!important; }
  .pp-grid .badge-pri{ font-size:14px!important; } .pp-grid .badge-new{ font-size:6.5px!important; }
  .pp-grid .qty-ctrl, .pp-grid .color-dot, .pp-grid .in-cart-mark{ display:none!important; }
}
</style>
</head>
<body class="min-h-screen p-4 md:p-5">

<!-- סל -->
<button id="cartBtn" onclick="openCart()">
    🛒 ההזמנה שלי <span class="cc" id="cartCnt">0</span>
</button>

<div id="cartModal">
  <div class="cart-box">
    <div class="cart-hdr">
      <h2>🛒 סל הזמנות</h2>
      <button onclick="closeCart()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;">✕</button>
    </div>
    <div class="cart-inputs">
      <input id="cName" type="text" placeholder="שם איש הקשר *" class="cart-inp">
      <input id="cPhone" type="tel" placeholder="טלפון נייד *" class="cart-inp">
    </div>
    <div id="cartList" style="padding:10px 16px;"><div style="text-align:center;padding:20px;color:#94a3b8;">הסל ריק</div></div>
    <div class="cart-ftr">
      <button class="btn-wa" onclick="sendOrder()">📲 שלח הזמנה בוואטסאפ</button>
      <button class="btn-close" onclick="closeCart()">סגור</button>
    </div>
  </div>
</div>

<script>
var IMGF="./images/", IMGE=".jpg";
var BRAND_LOGO="logo.png"; // לוגו המותג — קובץ ליד ה-HTML (או data URI מוטמע)
var WA=""; // ריק = בוחרים נמען בוואטסאפ בכל שליחה. למספר קבוע: שים "9725XXXXXXXX"
var imgCache={}, allItems=[], catOrder=[], catColors={}, cart={}, custOrder=[], sortDragEl=null, activeCpId=null;
var printSel={}; // פריטים שנבחרו להדפסה (ריק = מדפיסים הכל)

var DEFAULT_ORDER=["גלידות","פררו - קינדר","מסטיקים | סוכריות | לקקנים","שוקולדים קו קופות","שוקולדים טבלאות | בונבונירות","עוגיות  | עוגות | וופלים | עוגות אישיות","חטיפים מלוחים | פיצוחים | מוצרי אירוח","חטיפי אנרגיה | דגני בוקר | מוצרי בריאות","מוצרי חלבון","מוצרים ארה\"ב","מסטיקים | סוכריות | לקקנים","שתייה קלה | טרופיות | חטיפי קרח","משקאות אנרגיה | בירות | יין | אלכוהול","רטבים | ממרחים | יבשים | אפיה | שמנים","מוצרים למשקל | לקריצים | גומי תפזורת | טופי","צעצועים | ממתקים","שתיה חמה | קפה | תה"];

var DEFAULT_COLORS={"מעיין יבוא":"#52a8dc","קידום מוצרים":"#1c2e54","מוצרים לשקל":"#f59e0b","גלידות":"#00b0f0","פררו - קינדר":"#ff0000","מסטיקים | סוכריות | לקקנים":"#f59e0b","שוקולדים קו קופות":"#f97316","שוקולדים טבלאות | בונבונירות":"#ffc000","עוגיות  | עוגות | וופלים | עוגות אישיות":"#a855f7","חטיפים מלוחים | פיצוחים | מוצרי אירוח":"#22c55e","חטיפי אנרגיה | דגני בוקר | מוצרי בריאות":"#92d050","מוצרי חלבון":"#00b050","מוצרים ארה\"ב":"#0070c0","שתייה קלה | טרופיות | חטיפי קרח":"#38bdf8","משקאות אנרגיה | בירות | יין | אלכוהול":"#6366f1","רטבים | ממרחים | יבשים | אפיה | שמנים":"#84cc16","מוצרים למשקל | לקריצים | גומי תפזורת | טופי":"#ec4899","צעצועים | ממתקים":"#14b8a6","שתיה חמה | קפה | תה":"#795548"};

var PALETTE=["#c00000","#ff0000","#ffc000","#ffff00","#92d050","#00b050","#00b0f0","#0070c0","#002060","#7030a0","#e74c3c","#e67e22","#f1c40f","#2ecc71","#1abc9c","#3498db","#9b59b6","#e91e63","#ff5722","#795548","#ffcccc","#ffe0b2","#fff9c4","#c8e6c9","#b2dfdb","#bbdefb","#e1bee7","#fce4ec","#f3e5f5","#e8eaf6","#7f0000","#bf360c","#827717","#1b5e20","#004d40","#0d47a1","#4a148c","#880e4f","#3e2723","#212121"];

function mk(t){return document.createElement(t);}
/* נרמול priority: SUN/שמש->sun, STAR/כוכב->star, חדש/new->חדש (ללא תלות באותיות/שפה) */
function priNorm(v){
    var s=String(v==null?"":v).trim(), l=s.toLowerCase();
    var map={"sun":"sun","שמש":"sun","star":"star","כוכב":"star","חדש":"חדש","new":"חדש","ניו":"חדש"};
    return map[l]||map[s]||"";
}

/* ── איחוד קטגוריות לפלייר ──
   כל "מעיין יבוא *" -> "מעיין יבוא" ; כל השאר -> "קידום מוצרים".
   לביטול האיחוד (קטגוריות מקוריות לפי ספק): שנה ל-CAT_MERGE=false. */
var CAT_MERGE=true;
function normalizeCat(raw){
    var c=String(raw==null?"":raw).trim();
    if(!CAT_MERGE) return c||"כללי";
    if(/^מעיין\s*יבוא/.test(c)) return "מעיין יבוא";
    if(/שקל/.test(c)) return "מוצרים לשקל";   // קטגוריית "מוצרים לשקל" נפרדת
    return "קידום מוצרים";
}

/* ── עזרי HTML משותפים (כרטיס חי + ייצוא סטטי) ── */
function pctStr(p){return p===Math.round(p)?String(Math.round(p)):String(p);}
/* פירוק מדרגות מבצע — עמיד לפסיקים, רווחים, או שילוב ("6=15%, 24=35%" / "6=15% 24=35%") */
function parseTiers(deal){
    var s=String(deal||""), tiers=[], m;
    var re=/(\d+(?:\.\d+)?)\s*=\s*(\d+(?:\.\d+)?)\s*%/g;      // "qty=pct%"
    while((m=re.exec(s))){ tiers.push({qty:Math.round(parseFloat(m[1])), pct:parseFloat(m[2])}); }
    if(!tiers.length){                                        // אחוז בודד בלי כמות ("30%")
        var re2=/(\d+(?:\.\d+)?)\s*%/g;
        while((m=re2.exec(s))){ tiers.push({qty:1, pct:parseFloat(m[1])}); }
    }
    return tiers;
}
function dealTop(deal){ // המדרגה עם אחוז ההנחה הגבוה ביותר (מקור אחיד לתווית ולמחיר)
    var tiers=parseTiers(deal), best=null;
    tiers.forEach(function(t){ if(!best||t.pct>best.pct) best=t; });
    return best;
}
function buyGet(deal){var t=dealTop(deal);if(!t)return"";return t.qty>1?("קנה "+t.qty+" קבל "+pctStr(t.pct)+"%"):(pctStr(t.pct)+"% הנחה");}
function packBag(name){var m=String(name||"").match(/(\d+)\s*\/\s*(\d+)/);return m?m[2]:"";}
/* פורמט תאריך תוקף: "28-11-2027" -> "28.11.27" */
function fmtValid(v){
    var s=String(v==null?"":v).trim(); if(!s)return"";
    var m=s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
    if(m){var y=m[3]; y=y.length>2?y.slice(-2):y; return (("0"+m[1]).slice(-2))+"."+(("0"+m[2]).slice(-2))+"."+y;}
    return s;
}

function metaHTML(item){
    var p=[];
    p.push('<span class="sku">מק"ט <b>'+item.id+'</b></span>');
    var pb=packBag(item.name); if(pb) p.push('<span class="pack">'+pb+' בחבילה</span>');
    var c=parseInt(item.carton)||0; if(c>0) p.push('<span class="pack">קרטון '+c+'</span>');
    var vd=fmtValid(item.validity); if(vd) p.push('<span class="pack">תוקף '+vd+'</span>');
    if(item.deposit&&String(item.deposit).trim()&&String(item.deposit).trim()!=="0") p.push('<span class="pack">♻️ פיקדון</span>');
    return p.join('');
}
/* תג כשרות (ירוק, פינה) — HTML משותף לכרטיס חי ולייצוא/הדפסה */
function kosherBadgeHTML(item){
    var k=item.kosher&&String(item.kosher).trim()?String(item.kosher).trim():"";
    return k?'<div class="kbadge">✡ '+k+'</div>':"";
}
function priceHTML(item,price){
    if(!(price>0)) return '<div class="priceinfo"></div>';
    var t=dealTop(item.deal);               // אותה מדרגה כמו התווית → נטו עקבי עם "קנה X קבל Y%"
    var pct=t?t.pct:0;
    var net=pct>0?price*(1-pct/100):price;
    var h='<div class="priceinfo"><div class="pnet"><span class="pnet-label">נטו</span><span class="pnet-val">₪'+net.toFixed(2)+'</span></div>';
    if(pct>0) h+='<span class="pstrike">₪'+price.toFixed(2)+'</span>';
    return h+'</div>';
}

/* צבע טקסט קריא מעל צבע רקע (שחור/לבן לפי בהירות) */
function lum(hex){hex=String(hex||"").replace("#","");if(hex.length===3)hex=hex.replace(/./g,"$&$&");if(hex.length<6)return 0;var r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)/255;}
function plusFg(col){return lum(col)>0.7?"#0f172a":"#fff";}

/* ── כרטיס סטטי (HTML) — משותף לייצוא ולעמודי הדפסה ── */
function _enc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function staticCardHTML(item,col,opts){
    opts=opts||{};
    var price=parseFloat(String(item.price||"0").replace(/,/g,""))||0;
    var src;
    if(opts.imgMap){ src=opts.imgMap[item.id]||(IMGF+item.id+IMGE); }
    else { src=imgCache[item.id]||(IMGF+item.id+IMGE); }
    var h='<div class="card" data-id="'+item.id+'" data-name="'+encodeURIComponent(item.name)+'" data-bar="'+_enc(item.bar||"")+'" data-cat="'+_enc(item.cat||"")+'" data-cat0="'+_enc(item.cat0||"")+'" data-kosher="'+_enc(item.kosher||"")+'">';
    h+='<div class="card-img"><div class="cat-rail" style="background:'+col+';"></div>';
    h+='<img src="'+src+'" alt="'+_enc(item.name)+'" onerror="this.style.display=\'none\'">';
    var t=dealTop(item.deal);
    if(t)h+='<div class="deal-stamp"><div class="b">'+pctStr(t.pct)+'%</div><div class="l">מבצע</div></div>';
    h+=kosherBadgeHTML(item);
    var pri=priNorm(item.priority);
    if(pri==="sun")h+='<div class="badge-pri">☀️</div>';
    else if(pri==="star")h+='<div class="badge-pri">⭐</div>';
    else if(pri==="חדש")h+='<div class="badge-new">✨ חדש</div>';
    h+='</div>';
    h+='<div class="card-body"><div class="card-name">'+_enc(item.name)+'</div>';
    var bg=buyGet(item.deal); if(bg)h+='<div class="buyget">'+bg+'</div>';
    h+='<div class="hc-meta">'+metaHTML(item)+'</div><div class="card-sep"></div>';
    h+='<div class="hc-price">'+priceHTML(item,price);
    if(opts.interactive){
        h+='<div class="qty-ctrl">';
        h+='<button data-id="'+item.id+'" data-name="'+encodeURIComponent(item.name)+'" data-delta="-1" onclick="handleQty(this)" class="qbtn qbtn-minus">−</button>';
        h+='<input type="number" data-id="'+item.id+'" data-name="'+encodeURIComponent(item.name)+'" id="q_'+item.id+'" value="0" min="0" class="qinp" oninput="handleQtyInp(this)">';
        h+='<button data-id="'+item.id+'" data-name="'+encodeURIComponent(item.name)+'" data-delta="1" onclick="handleQty(this)" class="qbtn qbtn-plus">+</button>';
        h+='</div><span id="ic_'+item.id+'" class="in-cart-mark" style="display:none;">✓</span>';
    }
    h+='</div></div></div>';
    return h;
}

/* ── סדר קטגוריות+פריטים (זהה ל-render) — משותף למסך/הדפסה/ייצוא ── */
function orderedSectionsFor(items){
    var catMap={};
    items.forEach(function(it){var c=it.cat||"כללי";(catMap[c]=catMap[c]||[]).push(it);});
    var order=catOrder.length>0?catOrder.slice():DEFAULT_ORDER.slice();
    Object.keys(catMap).forEach(function(c){if(order.indexOf(c)<0)order.push(c);});
    var out=[];
    order.forEach(function(cat,idx){
        if(!catMap[cat]||!catMap[cat].length)return;
        var col=catColors[cat]||DEFAULT_COLORS[cat]||PALETTE[idx%PALETTE.length];
        var customOrd=itemCustomOrder[cat]||[];
        var sorted=catMap[cat].slice().sort(function(a,b){
            var ia=customOrd.indexOf(a.id),ib=customOrd.indexOf(b.id);
            if(ia>=0&&ib>=0)return ia-ib; if(ia>=0)return -1; if(ib>=0)return 1;
            var oa=parseInt(a.order)||0,ob=parseInt(b.order)||0;
            if(oa>0&&ob>0)return oa-ob; if(oa>0)return -1; if(ob>0)return 1;
            return (parseInt(a.sortCode)||0)-(parseInt(b.sortCode)||0);
        });
        out.push({cat:cat,col:col,items:sorted});
    });
    return out;
}

/* ── בונה עמודי הדפסה A4: כל עמוד = כותרת מלאה + 12 כרטיסים ממורכזים + פס הזמנות ── */
function buildPrintPagesHTML(opts){
    opts=opts||{};
    var logo=opts.logo||BRAND_LOGO||"";
    var title=_enc(opts.title||((document.getElementById("hTitle")||{}).textContent||"מבצעי החודש"));
    var validRaw=(opts.valid!=null?opts.valid:((document.getElementById("hValid")||{}).textContent||"")).trim();
    var validShort=_enc(validRaw.replace(/^🗓️\s*/,"").trim());
    var sections=orderedSectionsFor(opts.items||allItems);
    if(!sections.length) return "";
    var PER=12, pagesHtml="";
    var brand='<div class="pp-brand"><div class="lg"><img src="'+logo+'" onerror="this.style.display=\'none\'"><span>מעיין נציגויות</span></div><div class="tt">'+title+'</div>'+(validShort?'<div class="vv">🗓️ '+validShort+'</div>':'')+'</div>';
    var foot='<div class="pp-foot"><img src="'+logo+'" onerror="this.style.display=\'none\'"><div class="c">📲 להזמנות בוואטסאפ</div><div class="s">מעיין נציגויות'+(validShort?' · '+validShort:'')+'</div></div>';
    // כל קטגוריה מתחילה בעמוד חדש — באנר קטגוריה נקי בכל עמוד, בלי ערבוב
    sections.forEach(function(s){

function buildCard(item){
    var col=catColors[item.cat]||DEFAULT_COLORS[item.cat]||"#52a8dc";
    var price=parseFloat(String(item.price||"0").replace(/,/g,""))||0;
    var nm=item.name||"";

    var card=mk("div"); card.className="card";
    card.setAttribute("data-id",item.id);
    card.setAttribute("data-name",nm);
    card.setAttribute("data-bar",item.bar||"");
    card.setAttribute("data-cat",item.cat||"");

    /* תמונה גדולה למעלה */
    var imgD=mk("div"); imgD.className="card-img";
    var rail=mk("div"); rail.className="cat-rail"; rail.style.background=col; imgD.appendChild(rail);
    var img=mk("img");
    img.src=imgCache[item.id]||(IMGF+item.id+IMGE);
    img.alt=nm;
    img.onerror=function(){this.style.display="none";var ph=mk("div");ph.className="no-img";ph.textContent="🎁";imgD.appendChild(ph);};
    imgD.appendChild(img);
    /* חותמת מבצע */
    var t=dealTop(item.deal);
    if(t){var st=mk("div");st.className="deal-stamp";st.innerHTML='<div class="b">'+pctStr(t.pct)+'%</div><div class="l">מבצע</div>';imgD.appendChild(st);}
    /* תג כשרות (ירוק, פינה) */
    if(item.kosher&&String(item.kosher).trim()){var kb=mk("div");kb.className="kbadge";kb.textContent="✡ "+String(item.kosher).trim();imgD.appendChild(kb);}
    /* צ'קבוקס בחירה להדפסה */
    var pc=mk("div"); pc.className="pcheck np"; pc.title="בחר להדפסה";
    if(printSel[item.id]){card.classList.add("psel");pc.textContent="✓";}
    (function(id,cardEl){pc.onclick=function(e){e.stopPropagation();togglePsel(id,cardEl);};})(item.id,card);
    imgD.appendChild(pc);
    /* priority */
    var pri=priNorm(item.priority);
    if(pri==="sun"||pri==="star"){var bp=mk("div");bp.className="badge-pri";bp.textContent=pri==="sun"?"☀️":"⭐";imgD.appendChild(bp);}
    else if(pri==="חדש"){var bn=mk("div");bn.className="badge-new";bn.textContent="✨ חדש";imgD.appendChild(bn);}
    var cdot=mk("div"); cdot.className="color-dot np"; cdot.style.background=col;
    (function(id,dot){cdot.onclick=function(e){e.stopPropagation();showCP(id,dot);};})(item.cat+"__"+item.id,cdot);
    imgD.appendChild(cdot);
    card.appendChild(imgD);

    /* גוף */
    var body=mk("div"); body.className="card-body";
    var nm_el=mk("div"); nm_el.className="card-name"; nm_el.textContent=nm; body.appendChild(nm_el);
    var bg=buyGet(item.deal);
    if(bg){var bgel=mk("div");bgel.className="buyget";bgel.textContent=bg;body.appendChild(bgel);}
    var meta=mk("div"); meta.className="hc-meta"; meta.innerHTML=metaHTML(item); body.appendChild(meta);
    var sep=mk("div"); sep.className="card-sep"; body.appendChild(sep);

    /* מחיר + כמות */
    var pr=mk("div"); pr.className="hc-price"; pr.innerHTML=priceHTML(item,price);
    var qRow=mk("div"); qRow.className="qty-ctrl np";
    var mb=mk("button"); mb.className="qbtn qbtn-minus"; mb.textContent="−";
    (function(id,name){mb.onclick=function(){chQty(id,name,-1);};})(item.id,nm);
    var qi=mk("input"); qi.type="number"; qi.className="qinp"; qi.id="q_"+item.id; qi.value="0"; qi.min="0";
    (function(id,name){qi.oninput=function(){setQ(id,name,this.value);};})(item.id,nm);
    var pl2=mk("button"); pl2.className="qbtn qbtn-plus"; pl2.textContent="+";
    (function(id,name){pl2.onclick=function(){chQty(id,name,1);};})(item.id,nm);

    var ic=mk("span"); ic.className="in-cart-mark np"; ic.id="ic_"+item.id; ic.textContent="✓ בסל"; ic.style.display="none";

/* ── RENDER ── */
function render(items){
    var g=document.getElementById("itemsGrid");
    var no=document.getElementById("noEl");
    g.innerHTML="";
    if(!items||!items.length){no.style.display="block";return;}
    no.style.display="none";
    document.getElementById("itemCount").textContent=items.length.toLocaleString()+" פריטים";

    // בנה map קטגוריות
    var catMap={};
    items.forEach(function(item){
        var cat=item.cat||"כללי";
        if(!catMap[cat])catMap[cat]=[];
        catMap[cat].push(item);
    });

    // סדר קטגוריות
    var order=catOrder.length>0?catOrder:DEFAULT_ORDER.slice();
    Object.keys(catMap).forEach(function(c){if(order.indexOf(c)<0)order.push(c);});

    order.forEach(function(cat,idx){
        if(!catMap[cat]||!catMap[cat].length)return;
        var col=catColors[cat]||DEFAULT_COLORS[cat]||PALETTE[idx%PALETTE.length];

        var sec=mk("div"); sec.className="cat-section"; sec.setAttribute("data-cat",cat);
        var hdr=mk("div"); hdr.className="cat-header";
        var stripe=mk("div"); stripe.className="cat-stripe"; stripe.style.background=col;
        var title=mk("h2"); title.textContent=cat;
        var cnt=mk("span"); cnt.className="cat-count"; cnt.textContent=catMap[cat].length+" פריטים";
        hdr.appendChild(stripe); hdr.appendChild(title); hdr.appendChild(cnt);
        sec.appendChild(hdr);

        var grid=mk("div"); grid.className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4";
        // מיין לפי סדר
        var customOrd=itemCustomOrder[cat]||[];
        var sorted=catMap[cat].slice().sort(function(a,b){
            var ia=customOrd.indexOf(a.id),ib=customOrd.indexOf(b.id);
            if(ia>=0&&ib>=0)return ia-ib; if(ia>=0)return -1; if(ib>=0)return 1;
            var oa=parseInt(a.order)||0,ob=parseInt(b.order)||0;
            if(oa>0&&ob>0)return oa-ob;
            if(oa>0)return -1; if(ob>0)return 1;
            return (parseInt(a.sortCode)||0)-(parseInt(b.sortCode)||0);
        });
        sorted.forEach(function(item){grid.appendChild(buildCard(item));});
        sec.appendChild(grid);
        g.appendChild(sec);
    });
}

/* ── נרמול ערך מבצע לאחוז ──
   אקסל שומר "80%" כמספר 0.8. הפונקציה ממירה מספר לאחוז (0.8->80%, 0.145->14.5%,
   40->40%) ומשאירה טקסט קיים שכבר כולל % או נוסחה ("50%", "1=10%, 4=33%") כמו שהוא. */
function normDeal(v){
    var s=String(v==null?"":v).trim();
    if(!s)return"";
    if(s.indexOf("%")>=0)return s;                 // כבר אחוז/נוסחה — השאר
    var n=parseFloat(s.replace(",","."));
    if(isNaN(n)||n<=0)return s;                      // לא מספר חיובי — השאר כמו שהוא
    var pct=n<=1?n*100:n;                            // 0.8->80 ; 40->40
    return (Math.round(pct*10)/10)+"%";             // עד ספרה עשרונית אחת
}

/* ── LOAD EXCEL ── */
function loadXLS(event){
    var file=event.target.files[0]; if(!file)return;
    var st=document.getElementById("fSt"); st.textContent="⏳ טוען...";
    var reader=new FileReader();
    reader.onload=function(e){
        try{
            var wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
            var sheet=wb.Sheets[wb.SheetNames[0]];
            /* זיהוי אוטומטי של שורת הכותרת: מדלג על כותרות-על שמעל השורה שמכילה "מפתח פריט" */
            var aoa=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
            var hIdx=aoa.findIndex(function(row){return Array.isArray(row)&&row.indexOf("מפתח פריט")>=0;});
            if(hIdx<0)hIdx=0;
            var rows=XLSX.utils.sheet_to_json(sheet,{defval:"",range:hIdx});
            if(!rows.length){st.textContent="❌ ריק";return;}
            var keys=Object.keys(rows[0]);
            var stockK=keys.find(function(k){return k.toUpperCase().indexOf("SNAPSHOT")>=0;})||"";
            var dealK=keys.find(function(k){return k==="מבצעים מעודכן";})||keys.find(function(k){return k==="מבצעים";})||"";

            var parsed=[];
            rows.forEach(function(row){
                var id=String(row["מפתח פריט"]||"").trim(); if(!id)return;
                if(isNaN(parseInt(id)))return;
                var stk=parseInt(String(row[stockK]||"0").replace(/,/g,""))||0; if(!stk)return;
                var deal=normDeal(dealK?row[dealK]:"");

/* ── המרת תמונה ל-data URI מכווץ (להטמעה בייצוא) ── */
function imgToDataURI(url,maxDim,q){
    return new Promise(function(res){
        var im=new Image();
        im.onload=function(){
            try{
                var w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
                if(!w||!h){res(null);return;}
                var s=Math.min(1,maxDim/Math.max(w,h));
                var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
                var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
                var ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cw,ch);
                ctx.drawImage(im,0,0,cw,ch);
                res(cv.toDataURL("image/jpeg",q));
            }catch(e){res(null);}
        };
        im.onerror=function(){res(null);};
        im.src=url;
    });
}
/* המרת אלמנט תמונה טעון ל-data URI (PNG, שומר שקיפות — ללוגו) */
function imgElToDataURI(imgEl,maxDim){
    try{
        var w=imgEl.naturalWidth,h=imgEl.naturalHeight;
        if(!w||!h)return null;
        var s=Math.min(1,maxDim/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
        var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
        cv.getContext("2d").drawImage(imgEl,0,0,cw,ch);
        return cv.toDataURL("image/png");
    }catch(e){return null;}
}

        row.addEventListener("dragover",function(e){e.preventDefault();if(!itemSortDragEl||itemSortDragEl===row)return;var rect=row.getBoundingClientRect();row.classList.remove("dt","db");if(e.clientY<rect.top+rect.height/2)row.classList.add("dt");else row.classList.add("db");});
        row.addEventListener("dragleave",function(){row.classList.remove("dt","db");});
        row.addEventListener("drop",function(e){e.preventDefault();row.classList.remove("dt","db");if(!itemSortDragEl||itemSortDragEl===row)return;var rect=row.getBoundingClientRect();if(e.clientY<rect.top+rect.height/2)list.insertBefore(itemSortDragEl,row);else list.insertBefore(itemSortDragEl,row.nextSibling);updItemNums();});
        list.appendChild(row);
    });
}

function updItemNums(){document.getElementById("itemSortList").querySelectorAll(".srow").forEach(function(r,i){var n=r.querySelector(".snum");if(n)n.textContent=i+1;});}

function confirmItemSort(){
    var cat=document.getElementById("itemSortCatSel").value; if(!cat)return;
    var rows=document.getElementById("itemSortList").querySelectorAll(".srow");
    itemCustomOrder[cat]=Array.from(rows).map(function(r){return r.getAttribute("data-id");});
    try{localStorage.setItem("promoItemOrder",JSON.stringify(itemCustomOrder));}catch(e){}
    document.getElementById("itemSortModal").style.display="none";
    render(allItems);
}

function resetItemSort(){
    var cat=document.getElementById("itemSortCatSel").value; if(!cat)return;
    delete itemCustomOrder[cat];
    loadItemSortList();
}

/* ── INIT ── */
window.onload=function(){
    document.getElementById("hDate").textContent=new Date().toLocaleDateString("he-IL",{year:"numeric",month:"long",day:"numeric"});
    try{var s=localStorage.getItem("promoCategoryOrder");if(s)catOrder=JSON.parse(s);}catch(e){}
    Object.keys(DEFAULT_COLORS).forEach(function(k){if(!catColors[k])catColors[k]=DEFAULT_COLORS[k];});
    try{var sc=localStorage.getItem("promoCategoryColors");if(sc){var pc=JSON.parse(sc);Object.keys(pc).forEach(function(k){catColors[k]=pc[k];});}}catch(e){}
    try{var lg=localStorage.getItem("promoLogo");if(lg){BRAND_LOGO=lg;var h=document.querySelector(".logo-img");if(h)h.src=lg;}}catch(e){}
    initHeaderEdit();
    document.getElementById("noEl").style.display="block";
};
/* כותרות ניתנות לעריכה — שחזור ושמירה בדפדפן */
function initHeaderEdit(){
    ["hTitle","hSub","hValid"].forEach(function(id){
        var el=document.getElementById(id); if(!el)return;
        try{var s=localStorage.getItem("promo_"+id);if(s!=null&&String(s).trim())el.textContent=s;}catch(e){}
        el.title="לחץ לעריכת הכותרת";
        el.addEventListener("input",function(){try{localStorage.setItem("promo_"+id,el.textContent);}catch(e){}});
        el.addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();el.blur();}});
    });
}
</script>
