<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבצעי אוגוסט 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family:'Heebo',sans-serif; background:#f0f4f8; }

/* ===== כרטיסייה ===== */
/* פריסה לרוחב: תמונה | שם+מטא | לוגו | מחיר+כמות */
.card {
    background:white;
    border:1px solid #eef2f7;
    border-radius:14px;
    overflow:hidden;
    display:grid;
    grid-template-columns:84px minmax(0,1fr) auto 176px;
    align-items:center;
    gap:14px;
    padding:11px 13px;
    box-shadow:0 2px 10px rgba(15,23,42,0.06);
    transition:transform .18s,box-shadow .18s;
    position:relative;
}
.card:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(15,23,42,0.12); }

/* תמונה */
.card-img {
    width:84px; height:84px; flex-shrink:0;
    background:#f8fafc;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}
.card-img img {
    width:100%; height:100%;
    object-fit:contain;
    padding:6px;
    box-sizing:border-box;
}
.no-img { font-size:34px; opacity:.25; }
.cat-rail { position:absolute; top:0; bottom:0; inset-inline-start:0; width:4px; }

/* מרכז — שם ומטא */
.hc-main { min-width:0; display:flex; flex-direction:column; gap:6px; }
.hc-meta { display:flex; flex-wrap:wrap; align-items:center; gap:5px 9px; font-size:11.5px; color:#64748b; }
.hc-meta .sku { font-weight:700; color:#334155; }
.hc-meta .sku b { color:#0f172a; font-variant-numeric:tabular-nums; }
.hc-meta .k { color:#1d4ed8; font-weight:600; }
.hc-meta .v { color:#334155; font-weight:600; font-variant-numeric:tabular-nums; }
.hc-meta .sep { width:3px; height:3px; border-radius:50%; background:#cbd5e1; flex-shrink:0; }

/* לוגו מותג — קטן ועדין */
.hc-logo { height:32px; width:auto; object-fit:contain; opacity:.5; flex-shrink:0; align-self:center; }

/* תג מבצע */
.deal-badge {
    position:absolute;
    top:8px;
    left:8px;
    background:#dc2626;
    color:white;
    font-size:13px;
    font-weight:900;
    padding:4px 10px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(220,38,38,0.4);
    z-index:2;
    line-height:1.3;
    text-align:center;
    max-width:90px;
}

/* priority */
.badge-pri { position:absolute; top:5px; inset-inline-end:5px; font-size:16px; z-index:2; filter:drop-shadow(0 1px 2px rgba(0,0,0,.2)); line-height:1; }
.badge-new { position:absolute; top:5px; inset-inline-end:5px; z-index:2; background:#2563eb; color:white; font-size:9px; font-weight:900; padding:2px 7px; border-radius:99px; }

/* שם */
.card-name { font-size:13.5px; font-weight:700; color:#1e293b; line-height:1.3; letter-spacing:-.01em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* מחיר וכמות */
.hc-price { display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    padding-inline-start:13px; border-inline-start:1px solid #eef2f7; }
.hc-price-top { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.deal-text { color:#dc2626; background:#fef2f2; border:1px solid #fbd0d0; border-radius:7px;
    padding:1px 7px; font-size:12px; font-weight:800; line-height:1.25; }
.pstrike { color:#cbd5e1; text-decoration:line-through; font-size:12px; font-variant-numeric:tabular-nums; }
.pnet { display:flex; align-items:baseline; gap:6px; }
.pnet-label { font-size:10.5px; font-weight:700; color:#16a34a; }
.pnet-val { font-size:20px; font-weight:900; color:#0f172a; line-height:1; font-variant-numeric:tabular-nums; }
.pnet-val small { font-size:12px; color:#64748b; }

/* בקרת כמות — קומפקטית */
.qty-ctrl { display:inline-flex; align-items:center; border:1.5px solid #e2e8f0; border-radius:9px; overflow:hidden; }
.qbtn { width:26px; height:26px; border:0; font-size:15px; font-weight:700; cursor:pointer; font-family:Heebo,sans-serif; line-height:1; }
.qbtn-minus { background:#f8fafc; color:#334155; }
.qbtn-minus:hover { background:#e2e8f0; }
.qbtn-plus { background:var(--plus,#38bdf8); color:var(--plusfg,#fff); }
.qbtn-plus:hover { filter:brightness(.95); }
.qinp { width:32px; height:26px; border:0; border-inline:1px solid #e2e8f0; text-align:center; font-size:13px; font-weight:700; font-family:Heebo,sans-serif; outline:none; -moz-appearance:textfield; }
.qinp::-webkit-outer-spin-button, .qinp::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.in-cart-mark { font-size:10.5px; color:#16a34a; font-weight:700; margin-inline-start:6px; }

/* ── עריכת הסל ── */
.cart-row { display:flex; align-items:center; gap:8px; background:#f8fafc; border:1px solid #eef2f7; border-radius:10px; padding:7px 9px; margin-bottom:6px; }
.cart-nm { flex:1; min-width:0; font-size:12.5px; font-weight:700; color:#1e293b; line-height:1.25; }
.cart-ctr { display:inline-flex; align-items:center; border:1.5px solid #e2e8f0; border-radius:9px; overflow:hidden; background:white; flex-shrink:0; }
.cart-ctr .cbtn { width:26px; height:26px; border:0; background:#f1f5f9; color:#334155; font-size:15px; font-weight:700; cursor:pointer; font-family:Heebo,sans-serif; line-height:1; }
.cart-ctr .cbtn-p { background:#38bdf8; color:white; }
.cart-ctr .cqi { width:34px; height:26px; border:0; border-inline:1px solid #e2e8f0; text-align:center; font-size:13px; font-weight:700; font-family:Heebo,sans-serif; outline:none; -moz-appearance:textfield; }
.cart-ctr .cqi::-webkit-outer-spin-button, .cart-ctr .cqi::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.cdel { width:28px; height:28px; border:0; background:#fef2f2; color:#dc2626; border-radius:8px; cursor:pointer; font-size:14px; flex-shrink:0; }
.cdel:hover { background:#fee2e2; }
.cart-total { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:800; color:#334155; padding:9px 4px 2px; border-top:1px dashed #e2e8f0; margin-top:4px; }

/* קטגוריה */
.cat-section { margin-bottom:28px; }
.cat-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid #f1f5f9; }
.cat-stripe { width:5px; height:32px; border-radius:3px; flex-shrink:0; }
.cat-header h2 { font-size:18px; font-weight:900; color:#1e293b; }
.cat-count { background:#f1f5f9; color:#64748b; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; }

/* Header */
.site-header { background:white; border-radius:20px; box-shadow:0 2px 16px rgba(0,0,0,.08); padding:14px 22px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:4px solid #dc2626; }
.logo-img { height:54px; width:auto; object-fit:contain; }
/* כותרות הניתנות לעריכה */
.h-edit { cursor:text; border-radius:6px; padding:1px 5px; outline:none; transition:background .15s,box-shadow .15s; }
.h-edit:hover { background:#f1f5f9; box-shadow:inset 0 0 0 1px #e2e8f0; }
.h-edit:focus { background:#fff; box-shadow:inset 0 0 0 2px #38bdf8; }

/* סל */
#cartBtn { position:fixed; bottom:24px; left:24px; z-index:500; background:#16a34a; color:white; border:none; border-radius:99px; padding:13px 20px; font-size:14px; font-weight:800; cursor:pointer; box-shadow:0 4px 18px rgba(22,163,74,0.4); display:none; align-items:center; gap:8px; font-family:Heebo,sans-serif; }
#cartBtn .cc { background:white; color:#16a34a; border-radius:99px; font-size:12px; font-weight:900; padding:1px 8px; }
#cartModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:flex-start; justify-content:flex-end; padding:16px; }
#cartModal.open { display:flex; }
.cart-box { background:white; border-radius:20px; width:420px; max-width:95vw; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden; }
.cart-hdr { padding:14px 18px 10px; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center; }
.cart-hdr h2 { font-size:16px; font-weight:800; color:#1e293b; }
.cart-inputs { padding:10px 18px; background:#f8fafc; border-bottom:1px solid #e2e8f0; display:flex; flex-direction:column; gap:7px; }
.cart-inp { border:2px solid #e2e8f0; border-radius:10px; padding:8px 12px; font-size:13px; font-family:Heebo,sans-serif; outline:none; direction:rtl; width:100%; box-sizing:border-box; }
.cart-inp:focus { border-color:#dc2626; }
#cartList { overflow-y:auto; flex:1; padding:10px 16px; min-height:60px; }
.cart-ftr { padding:12px 18px; border-top:1px solid #f1f5f9; display:flex; flex-direction:column; gap:7px; }
.btn-wa { background:#25d366; color:white; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:800; cursor:pointer; font-family:Heebo,sans-serif; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-close { background:transparent; color:#94a3b8; border:2px solid #e2e8f0; border-radius:12px; padding:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:Heebo,sans-serif; }

/* color picker */
#cpopup { position:fixed; z-index:2000; background:white; border-radius:13px; padding:11px; box-shadow:0 8px 28px rgba(0,0,0,.22); display:none; width:318px; }
.cpopup-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:5px; }
.csw { width:23px; height:23px; border-radius:4px; cursor:pointer; border:2px solid transparent; transition:transform .15s; }
.csw:hover { transform:scale(1.25); border-color:rgba(0,0,0,.25); }
.color-dot { position:absolute; bottom:7px; left:7px; width:20px; height:20px; border-radius:50%; border:2px solid white; cursor:pointer; z-index:3; box-shadow:0 2px 5px rgba(0,0,0,.2); }

/* sort modal */
#sortModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
#sortModal.open { display:flex; }
.sbox { background:white; border-radius:20px; padding:22px; max-width:540px; width:93%; max-height:83vh; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden; }
.srow { display:flex; align-items:center; gap:9px; background:#f8fafc; border:2px solid #e2e8f0; border-radius:10px; padding:8px 11px; cursor:grab; user-select:none; }
.srow.dragging { opacity:.4; border-color:#dc2626; }
.srow.dt { border-top:3px solid #dc2626!important; }
.srow.db { border-bottom:3px solid #dc2626!important; }
.srow img { width:36px; height:36px; object-fit:contain; border-radius:5px; background:#f1f5f9; border:1px solid #e2e8f0; flex-shrink:0; }
.srow .si { flex:1; min-width:0; }
.srow .sn { font-size:11.5px; font-weight:700; color:#1e293b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.srow .sid { font-size:9.5px; color:#94a3b8; }
.srow .snum { font-size:11px; font-weight:700; color:#dc2626; min-width:20px; text-align:center; }
.srow .sh { color:#94a3b8; font-size:15px; flex-shrink:0; }
#ssearch { direction:rtl; width:100%; border:2px solid #e2e8f0; border-radius:99px; padding:7px 13px; font-size:13px; outline:none; font-family:inherit; }
#ssearch:focus { border-color:#dc2626; }

/* ── מובייל: פריסת כרטיס נוחה (תמונה+שם למעלה, מחיר+כמות בשורה מתחת) ── */
@media (max-width:600px){
  .card{ grid-template-columns:62px minmax(0,1fr); grid-template-areas:"img main" "price price"; gap:9px 11px; padding:11px 12px; }
  .hc-main{ overflow:hidden; }
  .hc-meta{ min-width:0; }
  .card-img{ grid-area:img; width:62px; height:62px; }
  .hc-main{ grid-area:main; }
  .hc-logo{ display:none; }               /* מסתירים את סימן המים במובייל */
  .card-name{ font-size:14px; }
  .hc-meta{ font-size:11px; gap:4px 8px; }
  .hc-price{ grid-area:price; flex-direction:row; flex-wrap:wrap; align-items:center; gap:7px 12px;
             border-inline-start:0; border-top:1px solid #eef2f7; padding-inline-start:0; padding-top:9px; margin-top:1px; }
  .hc-price .qty-ctrl{ margin-inline-start:auto; }   /* דוחף את בקר הכמות לקצה */
  .pnet-val{ font-size:21px; }
  /* כותרת שלא תידחס */
  .site-header{ flex-wrap:wrap; justify-content:center; text-align:center; gap:8px 14px; padding:12px 14px; }
  .site-header>div{ min-width:0!important; }
}

/* הדפסה */
@page { size:A4 portrait; margin:1cm 0.8cm; }
@media print {
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:white!important;padding:0!important;}
  .np{display:none!important;}
  .max-w-7xl{max-width:100%!important;margin:0!important;}
  .site-header{box-shadow:none!important;border-radius:0!important;margin-bottom:10px!important;padding:6px 12px!important;page-break-after:avoid!important;}
  .cat-section{page-break-inside:avoid!important;margin-bottom:12px!important;}
  .cat-header{margin-bottom:8px!important;padding-bottom:6px!important;}
  .cat-header h2{font-size:13px!important;}
  .cat-count{font-size:9px!important;}
  /* שתי עמודות של שורות קומפקטיות */
  .grid{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:6px!important;}
  .card{page-break-inside:avoid!important;break-inside:avoid!important;box-shadow:none!important;
    border:1px solid #e2e8f0!important;border-radius:8px!important;
    grid-template-columns:52px minmax(0,1fr) auto 108px!important;gap:8px!important;padding:6px 8px!important;}
  .card-img{width:52px!important;height:52px!important;}
  .card-img img{padding:3px!important;}
  .card-name{font-size:9px!important;line-height:1.2!important;}
  .hc-meta{font-size:7.3px!important;gap:2px 6px!important;}
  .hc-logo{height:18px!important;opacity:.4!important;}
  .hc-price{padding-inline-start:8px!important;gap:3px!important;}
  .deal-text{font-size:8px!important;padding:1px 5px!important;}
  .pstrike{font-size:8px!important;}
  .pnet-label{font-size:7px!important;}
  .pnet-val{font-size:12px!important;}
  .badge-pri{font-size:12px!important;}
  .badge-new{font-size:6.5px!important;}
  .qty-ctrl,.color-dot,.in-cart-mark{display:none!important;}
}
</style>
</head>
<body class="min-h-screen p-4 md:p-5">

<!-- סל -->
<button id="cartBtn" onclick="openCart()">
    🛒 ההזמנה שלי <span class="cc" id="cartCnt">0</span>
</button>

<div id="cartModal">
  <div class="cart-box">
    <div class="cart-hdr">
      <h2>🛒 סל הזמנות</h2>
      <button onclick="closeCart()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;">✕</button>
    </div>
    <div class="cart-inputs">
      <input id="cName" type="text" placeholder="שם איש הקשר *" class="cart-inp">
      <input id="cPhone" type="tel" placeholder="טלפון נייד *" class="cart-inp">
    </div>
    <div id="cartList" style="padding:10px 16px;"><div style="text-align:center;padding:20px;color:#94a3b8;">הסל ריק</div></div>
    <div class="cart-ftr">
      <button class="btn-wa" onclick="sendOrder()">📲 שלח הזמנה בוואטסאפ</button>
      <button class="btn-close" onclick="closeCart()">סגור</button>
    </div>
  </div>
</div>

<!-- Color Popup -->
<div id="cpopup"><div class="cpopup-grid" id="cpopupGrid"></div></div>

<!-- Item Sort Modal -->
<div id="itemSortModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;">
  <div class="sbox">
    <div>
      <h2 style="font-size:17px;font-weight:800;color:#1e293b;">⇄ סדר פריטים</h2>
      <p style="font-size:11px;color:#64748b;">בחר קטגוריה וגרור פריטים לסדר הרצוי</p>
    </div>
    <select id="itemSortCatSel" onchange="loadItemSortList()" style="direction:rtl;width:100%;border:2px solid #e2e8f0;border-radius:10px;padding:7px 12px;font-size:13px;outline:none;font-family:inherit;">
      <option value="">-- בחר קטגוריה --</option>
    </select>
    <div id="itemSortList" style="overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:5px;"></div>
    <div style="display:flex;gap:9px;justify-content:space-between;">
      <button onclick="resetItemSort()" style="padding:6px 14px;border-radius:99px;border:2px solid #e2e8f0;font-weight:700;font-size:12px;cursor:pointer;color:#ef4444;font-family:inherit;">↺ איפוס</button>
      <div style="display:flex;gap:9px;">
        <button onclick="document.getElementById('itemSortModal').style.display='none'" style="padding:6px 16px;border-radius:99px;border:2px solid #e2e8f0;font-weight:700;font-size:12px;cursor:pointer;color:#64748b;font-family:inherit;">ביטול</button>
        <button onclick="confirmItemSort()" style="padding:6px 20px;border-radius:99px;background:#0d9488;color:white;font-weight:700;font-size:12px;cursor:pointer;border:none;font-family:inherit;">✓ אישור</button>
      </div>
    </div>
  </div>
</div>

<!-- Sort Modal -->
<div id="sortModal">
  <div class="sbox">
    <div><h2 style="font-size:17px;font-weight:800;color:#1e293b;">⇅ סדר קטגוריות</h2><p style="font-size:11px;color:#64748b;">גרור לסדר הרצוי</p></div>
    <input type="text" id="ssearch" placeholder="חיפוש קטגוריה..." oninput="filterSort()">
    <div id="slist" style="overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:5px;"></div>
    <div style="display:flex;gap:9px;justify-content:space-between;">
      <button onclick="resetSort()" style="padding:6px 14px;border-radius:99px;border:2px solid #e2e8f0;font-weight:700;font-size:12px;cursor:pointer;color:#ef4444;font-family:inherit;">↺ איפוס</button>
      <div style="display:flex;gap:9px;">
        <button onclick="document.getElementById('sortModal').classList.remove('open')" style="padding:6px 16px;border-radius:99px;border:2px solid #e2e8f0;font-weight:700;font-size:12px;cursor:pointer;color:#64748b;font-family:inherit;">ביטול</button>
        <button onclick="confirmSort()" style="padding:6px 20px;border-radius:99px;background:#dc2626;color:white;font-weight:700;font-size:12px;cursor:pointer;border:none;font-family:inherit;">✓ אישור</button>
      </div>
    </div>
  </div>
</div>

<div class="max-w-7xl mx-auto">

<!-- HEADER -->
<header class="site-header">
  <div style="text-align:right;min-width:120px;">
    <div id="hSub" class="h-edit" contenteditable="true" spellcheck="false" style="font-size:13px;font-weight:700;color:#1e293b;">🔥 מבצעי אוגוסט 2026</div>
    <div id="itemCount" style="font-size:11px;color:#94a3b8;margin-top:1px;"></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
    <img src="./logo.png" class="logo-img" alt="לוגו" onerror="this.style.display='none'">
    <h1 id="hTitle" class="h-edit" contenteditable="true" spellcheck="false" style="font-size:1.6rem;font-weight:900;color:#1e293b;">מבצעי החודש</h1>
  </div>
  <div style="min-width:110px;text-align:left;font-size:12px;color:#94a3b8;" id="hDate"></div>
</header>

<!-- Toolbar -->
<div class="np flex justify-between items-center mb-4 gap-3 flex-wrap">
  <div class="flex items-center gap-3 flex-wrap">
    <label for="xlIn" class="cursor-pointer bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-5 rounded-full shadow flex items-center gap-2">📂 טען אקסל</label>
    <input type="file" id="xlIn" accept=".xlsx,.xls" class="hidden" onchange="loadXLS(event)">
    <label for="imgIn" class="cursor-pointer bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-5 rounded-full shadow flex items-center gap-2">🖼️ תמונות</label>
    <input type="file" id="imgIn" webkitdirectory class="hidden" onchange="loadImgs(event)">
    <label for="logoIn" class="cursor-pointer bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-5 rounded-full shadow flex items-center gap-2">🏷️ טען לוגו</label>
    <input type="file" id="logoIn" accept="image/*" class="hidden" onchange="loadLogo(event)">
    <button onclick="document.getElementById('sortModal').classList.add('open');renderSortList()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-5 rounded-full shadow">⇅ סדר קטגוריות</button>
    <button onclick="openItemSort()" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-5 rounded-full shadow">⇄ סדר פריטים</button>
    <button onclick="exportStatic()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-5 rounded-full shadow">📤 ייצא קובץ מוכן</button>
    <span id="fSt" class="text-sm text-gray-400"></span>
  </div>
  <div class="flex gap-3 items-center">
    <input type="text" id="srch" oninput="doSearch()" placeholder="🔍 חיפוש..."
      class="bg-white border-2 border-red-200 focus:border-red-500 rounded-full py-2 px-4 text-sm outline-none" style="direction:rtl;width:180px;">
    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-full shadow">🖨️ הדפס</button>
  </div>
</div>

<div id="noEl" style="display:none;text-align:center;padding:60px;color:#94a3b8;font-size:18px;">טען קובץ אקסל להתחלה 📂</div>
<div id="itemsGrid"></div>
</div>

<script>
var IMGF="./images/", IMGE=".jpg";
var BRAND_LOGO="logo.png"; // לוגו המותג — קובץ ליד ה-HTML (או data URI מוטמע)
var WA=""; // ריק = בוחרים נמען בוואטסאפ בכל שליחה. למספר קבוע: שים "9725XXXXXXXX"
var imgCache={}, allItems=[], catOrder=[], catColors={}, cart={}, custOrder=[], sortDragEl=null, activeCpId=null;

var DEFAULT_ORDER=["גלידות","פררו - קינדר","מסטיקים | סוכריות | לקקנים","שוקולדים קו קופות","שוקולדים טבלאות | בונבונירות","עוגיות  | עוגות | וופלים | עוגות אישיות","חטיפים מלוחים | פיצוחים | מוצרי אירוח","חטיפי אנרגיה | דגני בוקר | מוצרי בריאות","מוצרי חלבון","מוצרים ארה\"ב","מסטיקים | סוכריות | לקקנים","שתייה קלה | טרופיות | חטיפי קרח","משקאות אנרגיה | בירות | יין | אלכוהול","רטבים | ממרחים | יבשים | אפיה | שמנים","מוצרים למשקל | לקריצים | גומי תפזורת | טופי","צעצועים | ממתקים","שתיה חמה | קפה | תה"];

var DEFAULT_COLORS={"גלידות":"#00b0f0","פררו - קינדר":"#ff0000","מסטיקים | סוכריות | לקקנים":"#f59e0b","שוקולדים קו קופות":"#f97316","שוקולדים טבלאות | בונבונירות":"#ffc000","עוגיות  | עוגות | וופלים | עוגות אישיות":"#a855f7","חטיפים מלוחים | פיצוחים | מוצרי אירוח":"#22c55e","חטיפי אנרגיה | דגני בוקר | מוצרי בריאות":"#92d050","מוצרי חלבון":"#00b050","מוצרים ארה\"ב":"#0070c0","שתייה קלה | טרופיות | חטיפי קרח":"#38bdf8","משקאות אנרגיה | בירות | יין | אלכוהול":"#6366f1","רטבים | ממרחים | יבשים | אפיה | שמנים":"#84cc16","מוצרים למשקל | לקריצים | גומי תפזורת | טופי":"#ec4899","צעצועים | ממתקים":"#14b8a6","שתיה חמה | קפה | תה":"#795548"};

var PALETTE=["#c00000","#ff0000","#ffc000","#ffff00","#92d050","#00b050","#00b0f0","#0070c0","#002060","#7030a0","#e74c3c","#e67e22","#f1c40f","#2ecc71","#1abc9c","#3498db","#9b59b6","#e91e63","#ff5722","#795548","#ffcccc","#ffe0b2","#fff9c4","#c8e6c9","#b2dfdb","#bbdefb","#e1bee7","#fce4ec","#f3e5f5","#e8eaf6","#7f0000","#bf360c","#827717","#1b5e20","#004d40","#0d47a1","#4a148c","#880e4f","#3e2723","#212121"];

function mk(t){return document.createElement(t);}

/* ── עזרי HTML משותפים (כרטיס חי + ייצוא סטטי) ── */
function metaHTML(item){
    var p=[];
    p.push('<span class="sku">מק"ט <b>'+item.id+'</b></span>');
    if(item.bar) p.push('<span>'+item.bar+'</span>');
    if(item.validity&&String(item.validity).trim()) p.push('<span class="v">📅 '+item.validity+'</span>');
    if(item.kosher&&String(item.kosher).trim()) p.push('<span class="k">🔵 '+item.kosher+'</span>');
    var q=[]; var c=parseInt(item.carton)||0, pl=parseInt(item.pallet)||0;
    if(c>0)q.push('📦 '+c); if(pl>0)q.push('🏗️ '+pl);
    if(q.length) p.push('<span>'+q.join(' · ')+'</span>');
    if(item.deposit&&String(item.deposit).trim()&&String(item.deposit).trim()!=="0") p.push('<span>♻️ פיקדון</span>');
    return p.join('<span class="sep"></span>');
}
function priceHTML(item,price){
    if(!(price>0)) return '';
    var deal=item.deal&&String(item.deal).trim()?String(item.deal).trim():'';
    var top,net='';
    if(deal){
        top='<span class="deal-text">'+deal+'</span><span class="pstrike">₪'+price.toFixed(2)+'</span>';
        var maxD=0;(deal.match(/(\d+(?:\.\d+)?)\s*%/g)||[]).forEach(function(m){var pp=parseFloat(m)||0;if(pp>maxD)maxD=pp;});
        if(maxD>0){var netP=price*(1-maxD/100);
            net='<div class="pnet"><span class="pnet-label">נטו</span><span class="pnet-val">₪'+netP.toFixed(2)+'</span></div>';}
        else net='<div class="pnet"><span class="pnet-val" style="font-size:18px;">₪'+price.toFixed(2)+'</span></div>';
    } else {
        top='<span class="pnet-val" style="font-size:19px;">₪'+price.toFixed(2)+'</span>';
    }
    return '<div class="hc-price-top">'+top+'</div>'+net;
}

/* צבע טקסט קריא מעל צבע רקע (שחור/לבן לפי בהירות) */
function lum(hex){hex=String(hex||"").replace("#","");if(hex.length===3)hex=hex.replace(/./g,"$&$&");if(hex.length<6)return 0;var r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)/255;}
function plusFg(col){return lum(col)>0.7?"#0f172a":"#fff";}

/* ── BUILD CARD (פריסה לרוחב) ── */
function buildCard(item){
    var col=catColors[item.cat]||DEFAULT_COLORS[item.cat]||"#dc2626";
    var price=parseFloat(String(item.price||"0").replace(/,/g,""))||0;
    var nm=item.name||"";

    var card=mk("div"); card.className="card";
    card.style.setProperty("--plus",col);
    card.style.setProperty("--plusfg",plusFg(col));
    card.setAttribute("data-id",item.id);
    card.setAttribute("data-name",nm);
    card.setAttribute("data-bar",item.bar||"");
    card.setAttribute("data-cat",item.cat||"");

    /* תמונה */
    var imgD=mk("div"); imgD.className="card-img";
    var rail=mk("div"); rail.className="cat-rail"; rail.style.background=col; imgD.appendChild(rail);
    var img=mk("img");
    img.src=imgCache[item.id]||(IMGF+item.id+IMGE);
    img.alt=nm;
    img.onerror=function(){this.style.display="none";var ph=mk("div");ph.className="no-img";ph.textContent="🎁";imgD.appendChild(ph);};
    imgD.appendChild(img);
    var pri=(item.priority||"").trim();
    if(pri==="sun"||pri==="star"){var bp=mk("div");bp.className="badge-pri";bp.textContent=pri==="sun"?"☀️":"⭐";imgD.appendChild(bp);}
    else if(pri==="חדש"){var bn=mk("div");bn.className="badge-new";bn.textContent="✨ חדש";imgD.appendChild(bn);}
    var cdot=mk("div"); cdot.className="color-dot np"; cdot.style.background=col;
    (function(id,dot){cdot.onclick=function(e){e.stopPropagation();showCP(id,dot);};})(item.cat+"__"+item.id,cdot);
    imgD.appendChild(cdot);
    card.appendChild(imgD);

    /* מרכז — שם ומטא */
    var main=mk("div"); main.className="hc-main";
    var nm_el=mk("div"); nm_el.className="card-name"; nm_el.textContent=nm; main.appendChild(nm_el);
    var meta=mk("div"); meta.className="hc-meta"; meta.innerHTML=metaHTML(item); main.appendChild(meta);
    card.appendChild(main);

    /* לוגו מותג */
    var lg=mk("img"); lg.className="hc-logo"; lg.src=BRAND_LOGO; lg.alt="";
    lg.onerror=function(){this.style.display="none";};
    card.appendChild(lg);

    /* מחיר + כמות */
    var pr=mk("div"); pr.className="hc-price"; pr.innerHTML=priceHTML(item,price);
    var qRow=mk("div"); qRow.className="qty-ctrl np";
    var mb=mk("button"); mb.className="qbtn qbtn-minus"; mb.textContent="−";
    (function(id,name){mb.onclick=function(){chQty(id,name,-1);};})(item.id,nm);
    var qi=mk("input"); qi.type="number"; qi.className="qinp"; qi.id="q_"+item.id; qi.value="0"; qi.min="0";
    (function(id,name){qi.oninput=function(){setQ(id,name,this.value);};})(item.id,nm);
    var pl2=mk("button"); pl2.className="qbtn qbtn-plus"; pl2.textContent="+";
    (function(id,name){pl2.onclick=function(){chQty(id,name,1);};})(item.id,nm);
    qRow.appendChild(mb); qRow.appendChild(qi); qRow.appendChild(pl2);
    pr.appendChild(qRow);
    var ic=mk("span"); ic.className="in-cart-mark"; ic.id="ic_"+item.id; ic.textContent="✓ בסל"; ic.style.display="none";
    pr.appendChild(ic);
    card.appendChild(pr);

    return card;
}

/* ── RENDER ── */
function render(items){
    var g=document.getElementById("itemsGrid");
    var no=document.getElementById("noEl");
    g.innerHTML="";
    if(!items||!items.length){no.style.display="block";return;}
    no.style.display="none";
    document.getElementById("itemCount").textContent=items.length.toLocaleString()+" פריטים";

    // בנה map קטגוריות
    var catMap={};
    items.forEach(function(item){
        var cat=item.cat||"כללי";
        if(!catMap[cat])catMap[cat]=[];
        catMap[cat].push(item);
    });

    // סדר קטגוריות
    var order=catOrder.length>0?catOrder:DEFAULT_ORDER.slice();
    Object.keys(catMap).forEach(function(c){if(order.indexOf(c)<0)order.push(c);});

    order.forEach(function(cat,idx){
        if(!catMap[cat]||!catMap[cat].length)return;
        var col=catColors[cat]||DEFAULT_COLORS[cat]||PALETTE[idx%PALETTE.length];

        var sec=mk("div"); sec.className="cat-section"; sec.setAttribute("data-cat",cat);
        var hdr=mk("div"); hdr.className="cat-header";
        var stripe=mk("div"); stripe.className="cat-stripe"; stripe.style.background=col;
        var title=mk("h2"); title.textContent=cat;
        var cnt=mk("span"); cnt.className="cat-count"; cnt.textContent=catMap[cat].length+" פריטים";
        hdr.appendChild(stripe); hdr.appendChild(title); hdr.appendChild(cnt);
        sec.appendChild(hdr);

        var grid=mk("div"); grid.className="grid grid-cols-1 xl:grid-cols-2 gap-3";
        // מיין לפי סדר
        var customOrd=itemCustomOrder[cat]||[];
        var sorted=catMap[cat].slice().sort(function(a,b){
            var ia=customOrd.indexOf(a.id),ib=customOrd.indexOf(b.id);
            if(ia>=0&&ib>=0)return ia-ib; if(ia>=0)return -1; if(ib>=0)return 1;
            var oa=parseInt(a.order)||0,ob=parseInt(b.order)||0;
            if(oa>0&&ob>0)return oa-ob;
            if(oa>0)return -1; if(ob>0)return 1;
            return (parseInt(a.sortCode)||0)-(parseInt(b.sortCode)||0);
        });
        sorted.forEach(function(item){grid.appendChild(buildCard(item));});
        sec.appendChild(grid);
        g.appendChild(sec);
    });
}

/* ── CART ── */
function chQty(id,name,d){
    var inp=document.getElementById("q_"+id); if(!inp)return;
    var nv=Math.max(0,(parseInt(inp.value)||0)+d); inp.value=nv;
    if(nv>0)cart[id]={id:id,name:name,qty:nv};else delete cart[id];
    var ic=document.getElementById("ic_"+id); if(ic)ic.style.display=nv>0?"inline":"none";
    updCartBtn();
}
function setQ(id,name,val){
    var nv=Math.max(0,parseInt(val)||0);
    var inp=document.getElementById("q_"+id); if(inp)inp.value=nv;
    if(nv>0)cart[id]={id:id,name:name,qty:nv};else delete cart[id];
    var ic=document.getElementById("ic_"+id); if(ic)ic.style.display=nv>0?"inline":"none";
    updCartBtn();
}
function updCartBtn(){
    var n=Object.keys(cart).length;
    var b=document.getElementById("cartBtn"); if(b)b.style.display=n>0?"flex":"none";
    var c=document.getElementById("cartCnt"); if(c)c.textContent=n;
}
function syncCard(id){ // מסנכרן את הכרטיס עם מצב הסל
    var q=cart[id]?parseInt(cart[id].qty)||0:0;
    var inp=document.getElementById("q_"+id); if(inp)inp.value=q;
    var ic=document.getElementById("ic_"+id); if(ic)ic.style.display=q>0?"inline":"none";
}
function cartAdd(id,d){
    if(!cart[id])return;
    var nv=Math.max(0,(parseInt(cart[id].qty)||0)+d);
    if(nv>0)cart[id].qty=nv; else delete cart[id];
    syncCard(id); updCartBtn(); renderCart();
}
function cartSetQ(id,val){
    if(!cart[id])return;
    var nv=Math.max(0,parseInt(val)||0);
    if(nv>0){cart[id].qty=nv; syncCard(id); updCartBtn(); updCartTotal();}
    else {delete cart[id]; syncCard(id); updCartBtn(); renderCart();}
}
function cartRemove(id){ delete cart[id]; syncCard(id); updCartBtn(); renderCart(); }
function updCartTotal(){
    var el=document.getElementById("cartTotal"); if(!el)return;
    var en=Object.values(cart);
    var units=en.reduce(function(s,e){return s+(parseInt(e.qty)||0);},0);
    el.innerHTML='<span>סה"כ</span><span>'+en.length+' פריטים · '+units+' יח׳</span>';
}
function renderCart(){
    var list=document.getElementById("cartList"); if(!list)return;
    var en=Object.values(cart); list.innerHTML="";
    if(!en.length){list.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8;">הסל ריק</div>';return;}
    en.forEach(function(e){
        var r=mk("div"); r.className="cart-row";
        var nm=mk("div"); nm.className="cart-nm"; nm.textContent=e.name;
        var ctr=mk("div"); ctr.className="cart-ctr";
        var mn=mk("button"); mn.className="cbtn"; mn.textContent="−";
        (function(id){mn.onclick=function(){cartAdd(id,-1);};})(e.id);
        var qi=mk("input"); qi.type="number"; qi.className="cqi"; qi.value=e.qty; qi.min="1";
        (function(id){qi.oninput=function(){cartSetQ(id,this.value);};})(e.id);
        var pl=mk("button"); pl.className="cbtn cbtn-p"; pl.textContent="+";
        (function(id){pl.onclick=function(){cartAdd(id,1);};})(e.id);
        ctr.appendChild(mn); ctr.appendChild(qi); ctr.appendChild(pl);
        var del=mk("button"); del.className="cdel"; del.textContent="🗑"; del.title="הסר מהסל";
        (function(id){del.onclick=function(){cartRemove(id);};})(e.id);
        r.appendChild(nm); r.appendChild(ctr); r.appendChild(del);
        list.appendChild(r);
    });
    var tot=mk("div"); tot.className="cart-total"; tot.id="cartTotal"; list.appendChild(tot);
    updCartTotal();
}
function openCart(){
    renderCart();
    document.getElementById("cartModal").classList.add("open");
}
function closeCart(){document.getElementById("cartModal").classList.remove("open");}
function sendOrder(){
    var n=document.getElementById("cName").value.trim();
    var ph=document.getElementById("cPhone").value.trim();
    if(!n){document.getElementById("cName").style.borderColor="#ef4444";document.getElementById("cName").focus();return;}
    if(!ph){document.getElementById("cPhone").style.borderColor="#ef4444";document.getElementById("cPhone").focus();return;}
    var en=Object.values(cart); if(!en.length){alert("הסל ריק");return;}
    var msg="🔥 *הזמנת מבצעים*\n────────\n👤 "+n+"\n📱 "+ph+"\n📅 "+new Date().toLocaleDateString("he-IL")+"\n────────\n\n";
    en.forEach(function(e,i){msg+=(i+1)+". *"+e.name+"*\n   מק\"ט: "+e.id+"\n   כמות: "+e.qty+"\n\n";});
    msg+="────────\nסה\"כ "+en.length+" פריטים";
    var base=(WA&&WA.trim())?("https://wa.me/"+WA.trim()+"?text="):"https://wa.me/?text=";
    window.open(base+encodeURIComponent(msg),"_blank");
}

/* ── COLOR PICKER ── */
function showCP(key,dot){
    var popup=document.getElementById("cpopup");
    if(activeCpId===key){popup.style.display="none";activeCpId=null;return;}
    activeCpId=key;
    var grid=document.getElementById("cpopupGrid"); grid.innerHTML="";
    // הצבע הוא לקטגוריה
    var cat=key.split("__")[0];
    PALETTE.forEach(function(c){
        var sw=mk("div"); sw.className="csw"; sw.style.background=c;
        sw.onclick=function(){
            catColors[cat]=c; dot.style.background=c;
            popup.style.display="none"; activeCpId=null;
            try{localStorage.setItem("promoCategoryColors",JSON.stringify(catColors));}catch(e){}
            render(allItems);
        };
        grid.appendChild(sw);
    });
    var r=dot.getBoundingClientRect();
    popup.style.top=(r.bottom+5)+"px";
    popup.style.left=Math.max(4,(r.left-140))+"px";
    popup.style.display="block";
    setTimeout(function(){
        document.addEventListener("click",function h(e){
            if(!popup.contains(e.target)&&e.target!==dot){popup.style.display="none";activeCpId=null;document.removeEventListener("click",h);}
        });
    },0);
}

/* ── SORT MODAL ── */
function renderSortList(){
    var list=document.getElementById("slist"); list.innerHTML="";
    var order=catOrder.length>0?catOrder:DEFAULT_ORDER.slice();
    // הוסף קטגוריות שאינן בסדר
    var catMap={};
    allItems.forEach(function(i){catMap[i.cat]=true;});
    Object.keys(catMap).forEach(function(c){if(order.indexOf(c)<0)order.push(c);});

    order.forEach(function(cat,idx){
        if(!catMap[cat])return;
        var col=catColors[cat]||DEFAULT_COLORS[cat]||PALETTE[idx%PALETTE.length];
        var row=mk("div"); row.className="srow";
        row.setAttribute("data-cat",cat); row.setAttribute("data-s",cat.toLowerCase()); row.setAttribute("draggable","true");
        var num=mk("span"); num.className="snum"; num.textContent=idx+1; row.appendChild(num);
        // צבע preview
        var prev=mk("div"); prev.style.cssText="width:36px;height:36px;border-radius:8px;background:"+col+";flex-shrink:0;"; row.appendChild(prev);
        var si=mk("div"); si.className="si";
        var sn=mk("div"); sn.className="sn"; sn.textContent=cat; si.appendChild(sn);
        var sid=mk("div"); sid.className="sid"; sid.textContent=(allItems.filter(function(i){return i.cat===cat;}).length)+" פריטים"; si.appendChild(sid);
        row.appendChild(si);
        var sh=mk("span"); sh.className="sh"; sh.textContent="⠿"; row.appendChild(sh);
        row.addEventListener("dragstart",function(e){sortDragEl=row;e.dataTransfer.effectAllowed="move";setTimeout(function(){row.classList.add("dragging");},0);});
        row.addEventListener("dragend",function(){row.classList.remove("dragging");list.querySelectorAll(".srow").forEach(function(r){r.classList.remove("dt","db");});updNums();sortDragEl=null;});
        row.addEventListener("dragover",function(e){e.preventDefault();if(!sortDragEl||sortDragEl===row)return;var rect=row.getBoundingClientRect();row.classList.remove("dt","db");if(e.clientY<rect.top+rect.height/2)row.classList.add("dt");else row.classList.add("db");});
        row.addEventListener("dragleave",function(){row.classList.remove("dt","db");});
        row.addEventListener("drop",function(e){e.preventDefault();row.classList.remove("dt","db");if(!sortDragEl||sortDragEl===row)return;var rect=row.getBoundingClientRect();if(e.clientY<rect.top+rect.height/2)list.insertBefore(sortDragEl,row);else list.insertBefore(sortDragEl,row.nextSibling);updNums();});
        list.appendChild(row);
    });
}
function updNums(){document.getElementById("slist").querySelectorAll(".srow").forEach(function(r,i){var n=r.querySelector(".snum");if(n)n.textContent=i+1;});}
function filterSort(){var q=document.getElementById("ssearch").value.trim().toLowerCase();document.getElementById("slist").querySelectorAll(".srow").forEach(function(r){r.style.display=(!q||r.getAttribute("data-s").indexOf(q)>=0)?"":"none";});}
function confirmSort(){
    var rows=document.getElementById("slist").querySelectorAll(".srow");
    catOrder=Array.from(rows).map(function(r){return r.getAttribute("data-cat");});
    try{localStorage.setItem("promoCategoryOrder",JSON.stringify(catOrder));}catch(e){}
    document.getElementById("sortModal").classList.remove("open");
    render(allItems);
}

/* ── נרמול ערך מבצע לאחוז ──
   אקסל שומר "80%" כמספר 0.8. הפונקציה ממירה מספר לאחוז (0.8->80%, 0.145->14.5%,
   40->40%) ומשאירה טקסט קיים שכבר כולל % או נוסחה ("50%", "1=10%, 4=33%") כמו שהוא. */
function normDeal(v){
    var s=String(v==null?"":v).trim();
    if(!s)return"";
    if(s.indexOf("%")>=0)return s;                 // כבר אחוז/נוסחה — השאר
    var n=parseFloat(s.replace(",","."));
    if(isNaN(n)||n<=0)return s;                      // לא מספר חיובי — השאר כמו שהוא
    var pct=n<=1?n*100:n;                            // 0.8->80 ; 40->40
    return (Math.round(pct*10)/10)+"%";             // עד ספרה עשרונית אחת
}

            var aoa=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});

            allItems=parsed;

            if(catOrder.length===0){try{var s=localStorage.getItem("promoCategoryOrder");if(s)catOrder=JSON.parse(s);}catch(e){}}
            Object.keys(DEFAULT_COLORS).forEach(function(k){if(!catColors[k])catColors[k]=DEFAULT_COLORS[k];});

/* ── המרת תמונה ל-data URI מכווץ (להטמעה בייצוא) ── */
function imgToDataURI(url,maxDim,q){
    return new Promise(function(res){
        var im=new Image();
        im.onload=function(){
            try{
                var w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
                if(!w||!h){res(null);return;}
                var s=Math.min(1,maxDim/Math.max(w,h));
                var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
                var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
                var ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cw,ch);
                ctx.drawImage(im,0,0,cw,ch);
                res(cv.toDataURL("image/jpeg",q));
            }catch(e){res(null);}
        };
        im.onerror=function(){res(null);};
        im.src=url;
    });
}
/* המרת אלמנט תמונה טעון ל-data URI (PNG, שומר שקיפות — ללוגו) */
function imgElToDataURI(imgEl,maxDim){
    try{
        var w=imgEl.naturalWidth,h=imgEl.naturalHeight;
        if(!w||!h)return null;
        var s=Math.min(1,maxDim/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
        var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
        cv.getContext("2d").drawImage(imgEl,0,0,cw,ch);
        return cv.toDataURL("image/png");
    }catch(e){return null;}
}

/* ── ITEM SORT ── */
var itemCustomOrder = {};
var itemSortDragEl = null;

function openItemSort(){
    if(!allItems.length){alert("טען קובץ אקסל קודם");return;}
    var sel=document.getElementById("itemSortCatSel");
    sel.innerHTML='<option value="">-- בחר קטגוריה --</option>';
    var cats={};
    allItems.forEach(function(i){cats[i.cat]=true;});
    var order=catOrder.length>0?catOrder:Object.keys(cats).sort();
    order.forEach(function(cat){
        if(!cats[cat])return;
        var opt=document.createElement("option"); opt.value=cat; opt.textContent=cat;
        sel.appendChild(opt);
    });
    document.getElementById("itemSortList").innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8;">בחר קטגוריה למעלה</div>';
    document.getElementById("itemSortModal").style.display="flex";
}

function loadItemSortList(){
    var cat=document.getElementById("itemSortCatSel").value;
    var list=document.getElementById("itemSortList"); list.innerHTML="";
    if(!cat)return;
    var items=allItems.filter(function(i){return i.cat===cat;});
    var customOrd=itemCustomOrder[cat]||[];
    var sorted=items.slice().sort(function(a,b){
        var ia=customOrd.indexOf(a.id),ib=customOrd.indexOf(b.id);
        if(ia>=0&&ib>=0)return ia-ib; if(ia>=0)return -1; if(ib>=0)return 1;
        var oa=parseInt(a.order)||0,ob=parseInt(b.order)||0;
        if(oa>0&&ob>0)return oa-ob; if(oa>0)return -1; if(ob>0)return 1;
        return (parseInt(a.sortCode)||0)-(parseInt(b.sortCode)||0);
    });
    sorted.forEach(function(item,idx){
        var row=mk("div"); row.className="srow";
        row.setAttribute("data-id",item.id); row.setAttribute("draggable","true");
        var num=mk("span"); num.className="snum"; num.textContent=idx+1; row.appendChild(num);
        var im=mk("img"); im.src=imgCache[item.id]||(IMGF+item.id+IMGE); im.onerror=function(){this.style.display="none";}; im.style.cssText="width:36px;height:36px;object-fit:contain;border-radius:5px;background:#f1f5f9;border:1px solid #e2e8f0;flex-shrink:0;"; row.appendChild(im);
        var si=mk("div"); si.className="si";
        var sn=mk("div"); sn.className="sn"; sn.textContent=item.name; si.appendChild(sn);
        var sid=mk("div"); sid.className="sid"; sid.textContent='מק"ט: '+item.id; si.appendChild(sid);
        row.appendChild(si);
        var sh=mk("span"); sh.className="sh"; sh.textContent="⠿"; row.appendChild(sh);
        row.addEventListener("dragstart",function(e){itemSortDragEl=row;e.dataTransfer.effectAllowed="move";setTimeout(function(){row.classList.add("dragging");},0);});
        row.addEventListener("dragend",function(){row.classList.remove("dragging");list.querySelectorAll(".srow").forEach(function(r){r.classList.remove("dt","db");});updItemNums();itemSortDragEl=null;});
        row.addEventListener("dragover",function(e){e.preventDefault();if(!itemSortDragEl||itemSortDragEl===row)return;var rect=row.getBoundingClientRect();row.classList.remove("dt","db");if(e.clientY<rect.top+rect.height/2)row.classList.add("dt");else row.classList.add("db");});
        row.addEventListener("dragleave",function(){row.classList.remove("dt","db");});
        row.addEventListener("drop",function(e){e.preventDefault();row.classList.remove("dt","db");if(!itemSortDragEl||itemSortDragEl===row)return;var rect=row.getBoundingClientRect();if(e.clientY<rect.top+rect.height/2)list.insertBefore(itemSortDragEl,row);else list.insertBefore(itemSortDragEl,row.nextSibling);updItemNums();});
        list.appendChild(row);
    });
}

function updItemNums(){document.getElementById("itemSortList").querySelectorAll(".srow").forEach(function(r,i){var n=r.querySelector(".snum");if(n)n.textContent=i+1;});}

function confirmItemSort(){
    var cat=document.getElementById("itemSortCatSel").value; if(!cat)return;
    var rows=document.getElementById("itemSortList").querySelectorAll(".srow");
    itemCustomOrder[cat]=Array.from(rows).map(function(r){return r.getAttribute("data-id");});
    try{localStorage.setItem("promoItemOrder",JSON.stringify(itemCustomOrder));}catch(e){}
    document.getElementById("itemSortModal").style.display="none";
    render(allItems);
}

function resetItemSort(){
    var cat=document.getElementById("itemSortCatSel").value; if(!cat)return;
    delete itemCustomOrder[cat];
    loadItemSortList();
}

/* ── INIT ── */
window.onload=function(){
    document.getElementById("hDate").textContent=new Date().toLocaleDateString("he-IL",{year:"numeric",month:"long",day:"numeric"});
    try{var s=localStorage.getItem("promoCategoryOrder");if(s)catOrder=JSON.parse(s);}catch(e){}
    Object.keys(DEFAULT_COLORS).forEach(function(k){if(!catColors[k])catColors[k]=DEFAULT_COLORS[k];});
    try{var sc=localStorage.getItem("promoCategoryColors");if(sc){var pc=JSON.parse(sc);Object.keys(pc).forEach(function(k){catColors[k]=pc[k];});}}catch(e){}
    try{var lg=localStorage.getItem("promoLogo");if(lg){BRAND_LOGO=lg;var h=document.querySelector(".logo-img");if(h)h.src=lg;}}catch(e){}
    initHeaderEdit();
    document.getElementById("noEl").style.display="block";
};
/* כותרות ניתנות לעריכה — שחזור ושמירה בדפדפן */
function initHeaderEdit(){
    ["hTitle","hSub"].forEach(function(id){
        var el=document.getElementById(id); if(!el)return;
        try{var s=localStorage.getItem("promo_"+id);if(s!=null&&String(s).trim())el.textContent=s;}catch(e){}
        el.title="לחץ לעריכת הכותרת";
        el.addEventListener("input",function(){try{localStorage.setItem("promo_"+id,el.textContent);}catch(e){}});
        el.addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();el.blur();}});
    });
}
