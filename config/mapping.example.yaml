# מיפוי סכימת חשבשבת → דומיינים עסקיים
# העתק ל-config/mapping.yaml ומלא לפי data/schema_report.md ו-data/catalog.json.
#
# לכל דומיין: שם הטבלה האמיתי (schema.table) + מיפוי שמות עמודות לוגיים
# לעמודות האמיתיות. ה-extract משתמש בשמות הלוגיים, כך שהניתוח לא תלוי
# בשמות המקוריים של חשבשבת.

# ─────────────────────────────────────────────
# מסמכים / שורות מכירה (בסיס לרווחיות ומעקב פריטים)
# ─────────────────────────────────────────────
sales:
  table: "dbo.___מלא_שם_טבלת_שורות_מסמך___"
  columns:
    doc_id: "___עמודת_מזהה_מסמך___"          # מספר מסמך
    doc_type: "___עמודת_סוג_מסמך___"          # סוג מסמך (חשבונית/זיכוי...)
    doc_date: "___עמודת_תאריך___"             # תאריך המסמך
    account: "___עמודת_חשבון_לקוח___"         # כרטיס לקוח
    item: "___עמודת_מק\"ט___"                 # מק"ט הפריט
    item_name: "___עמודת_שם_פריט___"
    quantity: "___עמודת_כמות___"
    unit_price: "___עמודת_מחיר_יחידה___"
    line_total: "___עמודת_סהכ_שורה___"         # סכום שורה (לפני/אחרי הנחה)
    cost: "___עמודת_עלות___"                   # עלות (לרווחיות) — אם קיים
    agent: "___עמודת_סוכן___"                  # סוכן/מפיץ — אם קיים
  # סינון סוגי מסמכים שנחשבים "מכירה" (מלא לפי הקודים בחשבשבת שלך)
  sale_doc_types: []      # לדוגמה: [305, 320]  (חשבונית מס)
  credit_doc_types: []    # זיכויים (יופחתו מהמכירות)

# ─────────────────────────────────────────────
# חשבונות (לקוחות/ספקים) — לשמות ולגיול
# ─────────────────────────────────────────────
accounts:
  table: "dbo.___שם_טבלת_חשבונות___"
  columns:
    account: "___עמודת_מפתח_חשבון___"
    name: "___עמודת_שם___"
    account_type: "___עמודת_סוג___"     # לקוח / ספק / הנהח"ש
    balance: "___עמודת_יתרה___"          # אם קיים כשדה מחושב

# ─────────────────────────────────────────────
# תנועות יומן / כרטסת — לגיול חובות ותזרים
# ─────────────────────────────────────────────
ledger:
  table: "dbo.___שם_טבלת_תנועות___"
  columns:
    account: "___עמודת_חשבון___"
    trans_date: "___עמודת_תאריך___"
    value_date: "___עמודת_תאריך_ערך___"   # לגיול/תזרים
    reference: "___עמודת_אסמכתא___"
    debit: "___עמודת_חובה___"
    credit: "___עמודת_זכות___"
    details: "___עמודת_פרטים___"

# ─────────────────────────────────────────────
# פריטים / מלאי
# ─────────────────────────────────────────────
items:
  table: "dbo.___שם_טבלת_פריטים___"
  columns:
    item: "___עמודת_מק\"ט___"
    name: "___עמודת_שם_פריט___"
    category: "___עמודת_קטגוריה___"     # אם קיים
    cost: "___עמודת_עלות___"
    stock_qty: "___עמודת_יתרת_מלאי___"

# ─────────────────────────────────────────────
# יעדי מכירות (מוגדרים ידנית — לא מגיע מחשבשבת)
# ערוך את הקובץ config/targets.yaml ליעדים בפועל.
# ─────────────────────────────────────────────
targets_file: "config/targets.yaml"
